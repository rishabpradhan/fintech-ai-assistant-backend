spring:
  application:
    name: project

  # ===============================
  # PostgreSQL Database
  # ===============================
  datasource:
    url: jdbc:postgresql://localhost:5432/project
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

    # ===============================
    # HikariCP Connection Pool
    # ===============================
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 30000
      max-lifetime: 1800000
      pool-name: UserMgmtHikariPool

  jpa:
    hibernate:
      ddl-auto: none

    show-sql: true

    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ===============================
  # Redis
  # ===============================
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # ===============================
  # Spring Cache
  # ===============================
  cache:
    type: redis

  # ===============================
  # Spring Session
  # ===============================
  session:
    jdbc:
      initialize-schema: never


# ==================================
# Server
# ==================================
server:
  port: 8080

# file storage
app:
  storage:
    upload-dir : D:/document

